buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.0' // Gunakan satu versi terbaru
        classpath 'com.google.gms:google-services:4.4.2' // Gunakan satu versi terbaru
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}